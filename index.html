<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" type="image/png"><title>Můj Brief</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#eef4ff;background:#0b1120}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}h1{margin:0;font-size:clamp(30px,5vw,46px)}.sub{color:#a8b6d1;margin:6px 0 0}button{background:#283a5b;border:1px solid #455a7d;border-radius:12px;color:white;padding:10px 13px;font-size:15px;cursor:pointer}button:focus-visible{outline:3px solid #86baff}.primary{background:#3669d5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.card{border:1px solid #33435f;border-radius:20px;background:#18243a;padding:20px;min-height:190px;box-shadow:0 8px 24px #0002}.card h2{font-size:20px;margin:0 0 14px}.card p{color:#b8c6de;line-height:1.55}.card a{color:#a9caff;text-decoration:none}.tools{display:flex;gap:7px;justify-content:flex-end;margin-top:15px}.tools button{padding:5px 11px}.big{font-size:32px;font-weight:700}.muted{font-size:13px;color:#9eacc6}.weather-summary{margin-top:12px;padding:14px;border-radius:14px;background:#101d33}.weather-summary .degree{font-size:38px;font-weight:750}.weather-details{width:100%;height:640px;border:0;border-radius:15px;background:#080f1f;margin-top:12px}.hidden{display:none}dialog{color:#f1f5ff;background:#17243a;border:1px solid #4a5c7c;border-radius:20px;width:min(460px,95vw)}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:10px}footer{color:#899ab8;margin-top:28px;font-size:13px}#status{color:#9ac2ff}</style></head><body><main><header><div><h1>☀️ Můj Brief</h1><p class="sub" id="today"></p></div><button class="primary" onclick="settings.showModal()">⚙️ Upravit karty</button></header><div class="grid" id="cards"></div><footer>První místní verze • Bez předplatného • Nastavení se ukládá v tomto prohlížeči. Počasí se načítá z Open-Meteo. Ostatní externí služby zatím nejsou propojené.</footer></main><dialog id="settings"><h2>Moje karty</h2><p>Zaškrtni, co chceš zobrazovat. Pořadí změníš šipkami přímo na kartách.</p><div id="choices"></div><button class="primary" onclick="settings.close();render()">Hotovo</button></dialog><script>const defs=[{id:'weather',name:'Počasí',icon:'🌤️',body:'Aktuální počasí se načítá…',url:'./pocasi.html' ,link:'Podrobná předpověď'},{id:'gmail',name:'Gmail',icon:'✉️',body:'Rychlý přístup k poště. Automatický počet nepřečtených zpráv zatím není propojen.',url:'https://mail.google.com/',link:'Otevřít Gmail'},{id:'corvette',name:'Corvette C3 1978',icon:'🚘',body:'Renovace L48 350, TH350 a hledání dílů. Zde později přidáme vlastní poznámky a aktuality.',url:'https://www.corvetteforum.com/forums/c3-corvettes-1968-1982-5/',link:'Otevřít fórum C3'},{id:'bambu',name:'Bambu Lab A1',icon:'🖨️',body:'Přístup k 3D modelům a tiskovým projektům. Živý stav tiskárny zatím není propojen.',url:'https://makerworld.com/',link:'Otevřít MakerWorld'},{id:'calendar',name:'Kalendář',icon:'📅',body:'Rychlý přístup ke kalendáři. Přehled událostí přidáme po bezpečném propojení.',url:'https://calendar.google.com/',link:'Otevřít kalendář'},{id:'samsung',name:'Samsung a tablet',icon:'📱',body:'Aktualizace One UI, tipy a novinky pro Galaxy Tab S10 Ultra.',url:'https://www.samsung.com/cz/support/',link:'Podpora Samsung'}];let order,enabled;try{order=JSON.parse(localStorage.getItem('brief-order'))||defs.map(x=>x.id);enabled=JSON.parse(localStorage.getItem('brief-enabled'))||defs.map(x=>x.id)}catch(e){order=defs.map(x=>x.id);enabled=defs.map(x=>x.id)}order=[...new Set([...order.filter(id=>defs.some(d=>d.id===id)),...defs.map(d=>d.id)])];document.getElementById('today').textContent=new Intl.DateTimeFormat('cs-CZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());function save(){try{localStorage.setItem('brief-order',JSON.stringify(order));localStorage.setItem('brief-enabled',JSON.stringify(enabled))}catch(e){}}function move(id,dir){let i=order.indexOf(id),j=i+dir;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];save();render()}function render(){document.getElementById('cards').innerHTML=order.filter(id=>enabled.includes(id)).map(id=>{let d=defs.find(x=>x.id===id);return `<section class="card"><h2>${d.icon} ${d.name}</h2><p>${d.body}</p>${id==='weather'?'<div id="weather-live" class="weather-summary" role="status">Načítám aktuální údaje…</div><button style="margin-top:12px" onclick="toggleWeatherDetails()" id="weather-expand">Zobrazit podrobnosti</button><iframe title="Podrobné počasí" id="weather-frame" class="weather-details hidden" data-src="./pocasi.html" loading="lazy"></iframe>':''}<p><a href="${d.url}" target="_blank" rel="noopener">${d.link} ↗</a></p><div class="tools"><button aria-label="Posunout ${d.name} nahoru" onclick="move('${id}',-1)">↑</button><button aria-label="Posunout ${d.name} dolů" onclick="move('${id}',1)">↓</button></div></section>`}).join('')||'<p>Žádné karty nejsou vybrané. Klepni na Upravit karty.</p>';if(enabled.includes('weather'))loadWeatherSummary();document.getElementById('choices').innerHTML=defs.map(d=>`<label><input type="checkbox" ${enabled.includes(d.id)?'checked':''} onchange="toggle('${d.id}',this.checked)">${d.icon} ${d.name}</label>`).join('')}function toggle(id,on){enabled=on?[...new Set([...enabled,id])]:enabled.filter(x=>x!==id);save()}render();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}</script><script>
async function loadWeatherSummary(){
 const target=document.getElementById('weather-live');if(!target)return;
 target.textContent='Načítám aktuální údaje…';
 try{
  const city=localStorage.getItem('mujbrief_weather_city')||'Pardubice';
  const gr=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=cs&format=json').then(r=>{if(!r.ok)throw Error('Město není dostupné');return r.json()});
  if(!gr.results?.length)throw Error('Město nebylo nalezeno');const p=gr.results[0];
  const params=new URLSearchParams({latitude:p.latitude,longitude:p.longitude,current:'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m',timezone:'auto'});
  const w=await fetch('https://api.open-meteo.com/v1/forecast?'+params).then(r=>{if(!r.ok)throw Error('Předpověď není dostupná');return r.json()});
  const c=w.current;const desc={0:'☀️ Jasno',1:'🌤️ Převážně jasno',2:'⛅ Polojasno',3:'☁️ Zataženo',45:'🌫️ Mlha',48:'🌫️ Mlha',61:'🌦️ Slabý déšť',63:'🌧️ Déšť',65:'🌧️ Silný déšť',71:'🌨️ Slabé sněžení',73:'❄️ Sněžení',75:'❄️ Silné sněžení',80:'🌦️ Přeháňky',81:'🌧️ Přeháňky',95:'⛈️ Bouřka'};
  const temp=n=>Number.isFinite(n)?Math.round(n)+' °C':'—';
  target.innerHTML='<div class="muted">'+p.name+' · '+c.time.replace('T',' ')+'</div><div class="degree">'+temp(c.temperature_2m)+'</div><div>'+ (desc[c.weather_code]||'🌤️ Proměnlivé počasí') +'</div><p class="muted">Pocitově '+temp(c.apparent_temperature)+' · Vítr '+Math.round(c.wind_speed_10m)+' km/h · Vlhkost '+Math.round(c.relative_humidity_2m)+' %</p><button onclick="loadWeatherSummary()">↻ Obnovit</button>';
 }catch(e){target.textContent='Počasí se nepodařilo načíst. '+e.message;}
}
function toggleWeatherDetails(){const f=document.getElementById('weather-frame'),b=document.getElementById('weather-expand');if(!f)return;const opening=f.classList.contains('hidden');f.classList.toggle('hidden');if(opening&&!f.src)f.src=f.dataset.src;b.textContent=opening?'Skrýt podrobnosti':'Zobrazit podrobnosti'}
</script></body></html>
