<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" type="image/png"><title>Můj Brief</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#eef4ff;background:#0b1120}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}h1{margin:0;font-size:clamp(30px,5vw,46px)}.sub{color:#a8b6d1;margin:6px 0 0}button{background:#283a5b;border:1px solid #455a7d;border-radius:12px;color:white;padding:10px 13px;font-size:15px;cursor:pointer}button:focus-visible{outline:3px solid #86baff}.primary{background:#3669d5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.card{border:1px solid #33435f;border-radius:20px;background:#18243a;padding:20px;min-height:190px;box-shadow:0 8px 24px #0002}.card h2{font-size:20px;margin:0 0 14px}.card p{color:#b8c6de;line-height:1.55}.card a{color:#a9caff;text-decoration:none}.tools{display:flex;gap:7px;justify-content:flex-end;margin-top:15px}.tools button{padding:5px 11px}.big{font-size:32px;font-weight:700}.muted{font-size:13px;color:#9eacc6}.hidden{display:none}dialog{color:#f1f5ff;background:#17243a;border:1px solid #4a5c7c;border-radius:20px;width:min(460px,95vw)}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:10px}footer{color:#899ab8;margin-top:28px;font-size:13px}#status{color:#9ac2ff}</style></head><body><main><header><div><h1>☀️ Můj Brief</h1><p class="sub" id="today"></p></div><button class="primary" onclick="settings.showModal()">⚙️ Upravit karty</button></header><div class="grid" id="cards"></div><footer>První místní verze • Bez předplatného • Nastavení se ukládá v tomto prohlížeči. Živé údaje z externích služeb zatím nejsou propojené.</footer></main><dialog id="settings"><h2>Moje karty</h2><p>Zaškrtni, co chceš zobrazovat. Pořadí změníš šipkami přímo na kartách.</p><div id="choices"></div><button class="primary" onclick="settings.close();render()">Hotovo</button></dialog><script>const defs=[{id:'weather',name:'Počasí',icon:'🌤️',body:'Předpověď počasí připojíme v další verzi. Zatím můžeš otevřít aktuální počasí.',url:'https://www.chmi.cz/' ,link:'Otevřít ČHMÚ'},{id:'gmail',name:'Gmail',icon:'✉️',body:'Rychlý přístup k poště. Automatický počet nepřečtených zpráv zatím není propojen.',url:'https://mail.google.com/',link:'Otevřít Gmail'},{id:'corvette',name:'Corvette C3 1978',icon:'🚘',body:'Renovace L48 350, TH350 a hledání dílů. Zde později přidáme vlastní poznámky a aktuality.',url:'https://www.corvetteforum.com/forums/c3-corvettes-1968-1982-5/',link:'Otevřít fórum C3'},{id:'bambu',name:'Bambu Lab A1',icon:'🖨️',body:'Přístup k 3D modelům a tiskovým projektům. Živý stav tiskárny zatím není propojen.',url:'https://makerworld.com/',link:'Otevřít MakerWorld'},{id:'calendar',name:'Kalendář',icon:'📅',body:'Rychlý přístup ke kalendáři. Přehled událostí přidáme po bezpečném propojení.',url:'https://calendar.google.com/',link:'Otevřít kalendář'},{id:'samsung',name:'Samsung a tablet',icon:'📱',body:'Aktualizace One UI, tipy a novinky pro Galaxy Tab S10 Ultra.',url:'https://www.samsung.com/cz/support/',link:'Podpora Samsung'}];let order,enabled;try{order=JSON.parse(localStorage.getItem('brief-order'))||defs.map(x=>x.id);enabled=JSON.parse(localStorage.getItem('brief-enabled'))||defs.map(x=>x.id)}catch(e){order=defs.map(x=>x.id);enabled=defs.map(x=>x.id)}order=[...new Set([...order.filter(id=>defs.some(d=>d.id===id)),...defs.map(d=>d.id)])];document.getElementById('today').textContent=new Intl.DateTimeFormat('cs-CZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());function save(){try{localStorage.setItem('brief-order',JSON.stringify(order));localStorage.setItem('brief-enabled',JSON.stringify(enabled))}catch(e){}}function move(id,dir){let i=order.indexOf(id),j=i+dir;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];save();render()}function render(){document.getElementById('cards').innerHTML=order.filter(id=>enabled.includes(id)).map(id=>{let d=defs.find(x=>x.id===id);return `<section class="card"><h2>${d.icon} ${d.name}</h2><p>${d.body}</p><p><a href="${d.url}" target="_blank" rel="noopener">${d.link} ↗</a></p><div class="tools"><button aria-label="Posunout ${d.name} nahoru" onclick="move('${id}',-1)">↑</button><button aria-label="Posunout ${d.name} dolů" onclick="move('${id}',1)">↓</button></div></section>`}).join('')||'<p>Žádné karty nejsou vybrané. Klepni na Upravit karty.</p>';document.getElementById('choices').innerHTML=defs.map(d=>`<label><input type="checkbox" ${enabled.includes(d.id)?'checked':''} onchange="toggle('${d.id}',this.checked)">${d.icon} ${d.name}</label>`).join('')}function toggle(id,on){enabled=on?[...new Set([...enabled,id])]:enabled.filter(x=>x!==id);save()}render();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}</script></body></html>
